<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>singlet</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b0c;
      --ink: #e8e4dc;
      --muted: #9aa08c;
      --code: #f4efe4;
      --surface: #161618;
      --ring: oklch(1 0 0 / 0.08);
      --ring-hover: oklch(1 0 0 / 0.13);
      --focus: #d7c49a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      font: 16px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      background: var(--bg);
      color: var(--ink);
    }
    main {
      width: min(42rem, calc(100% - 2rem));
      padding: 2.5rem 0;
    }
    h1 {
      margin: 0 0 2rem;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .block { margin: 0 0 1.25rem; }
    .block:last-of-type { margin-bottom: 0; }
    h2 {
      margin: 0 0 0.5rem;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .cmd {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 0 0 1px var(--ring);
      cursor: pointer;
      transition-property: box-shadow;
      transition-duration: 150ms;
      transition-timing-function: ease-out;
    }
    .cmd:hover { box-shadow: 0 0 0 1px var(--ring-hover); }
    .cmd pre {
      flex: 1 1 auto;
      min-width: 0;
      margin: 0;
      padding: 0.65rem 0.7rem;
      color: var(--code);
      overflow-x: auto;
    }
    .cmd code {
      font: inherit;
      user-select: all;
      -webkit-user-select: all;
      white-space: nowrap;
    }
    .copy {
      flex: none;
      min-width: 5.5rem;
      min-height: 2.5rem;
      padding: 0 0.85rem;
      border: 0;
      border-radius: 6px;
      background: oklch(1 0 0 / 0.06);
      box-shadow: 0 0 0 1px var(--ring);
      color: var(--ink);
      font: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      transition-property: box-shadow, color, background-color, transform;
      transition-duration: 150ms;
      transition-timing-function: ease-out;
    }
    .copy:hover { box-shadow: 0 0 0 1px var(--ring-hover); }
    .copy:focus { outline: none; }
    .copy:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .copy.is-copied { color: var(--muted); }
    @media (prefers-reduced-motion: no-preference) {
      .copy:active { transform: scale(0.96); }
    }
    .status {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main>
    <h1>singlet</h1>

    <section class="block" aria-labelledby="install-label">
      <h2 id="install-label">Install</h2>
      <div class="cmd">
        <pre><code id="install-cmd">curl -fsSL https://singlet.xroma.dev/install.sh | sh</code></pre>
        <button type="button" class="copy" data-copy="install-cmd" aria-label="Copy install command">Copy</button>
      </div>
    </section>

    <section class="block" aria-labelledby="uninstall-label">
      <h2 id="uninstall-label">Uninstall</h2>
      <div class="cmd">
        <pre><code id="uninstall-cmd">curl -fsSL https://singlet.xroma.dev/uninstall.sh | sh</code></pre>
        <button type="button" class="copy" data-copy="uninstall-cmd" aria-label="Copy uninstall command">Copy</button>
      </div>
    </section>

    <p class="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    (function () {
      var status = document.querySelector(".status");
      var resetTimer;

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text);
        }
        return new Promise(function (resolve, reject) {
          var ta = document.createElement("textarea");
          ta.value = text;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.left = "-9999px";
          document.body.appendChild(ta);
          ta.select();
          try {
            if (!document.execCommand("copy")) throw new Error("copy failed");
            resolve();
          } catch (err) {
            reject(err);
          } finally {
            ta.remove();
          }
        });
      }

      function copyFrom(btn) {
        var code = document.getElementById(btn.getAttribute("data-copy"));
        if (!code) return;
        var label = btn.getAttribute("aria-label") || "Copy";
        copyText(code.textContent).then(function () {
          document.querySelectorAll(".copy").forEach(function (other) {
            other.textContent = "Copy";
            other.classList.remove("is-copied");
          });
          btn.textContent = "Copied";
          btn.classList.add("is-copied");
          if (status) status.textContent = label.replace(/^Copy/, "Copied");
          clearTimeout(resetTimer);
          resetTimer = setTimeout(function () {
            btn.textContent = "Copy";
            btn.classList.remove("is-copied");
            if (status) status.textContent = "";
          }, 1600);
        }).catch(function () {
          if (status) status.textContent = "Copy failed. Select the command and copy it.";
        });
      }

      document.querySelectorAll(".cmd").forEach(function (cmd) {
        cmd.addEventListener("click", function () {
          var btn = cmd.querySelector(".copy");
          if (btn) copyFrom(btn);
        });
      });
    })();
  </script>
</body>
</html>
